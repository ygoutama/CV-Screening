<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1e2433; --muted:#6b7280; --line:#e3e7ef;
    --brand:#3949ab; --brand2:#1e2a78; --ok:#2e7d32; --warn:#b45309; --bad:#b91c1c; --soft:#eef1fa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px;}
  header{background:linear-gradient(120deg,var(--brand2),var(--brand)); color:#fff; padding:18px 28px;}
  header h1{font-size:19px; letter-spacing:.3px;}
  header p{font-size:12.5px; opacity:.85; margin-top:4px;}
  .wrap{max-width:1180px; margin:0 auto; padding:20px;}
  nav.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  nav.tabs button{border:1px solid var(--line); background:#fff; padding:9px 16px; border-radius:8px 8px 0 0; cursor:pointer; font-weight:600; color:var(--muted); font-size:13px;}
  nav.tabs button.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px;}
  h2{font-size:16px; margin-bottom:10px; color:var(--brand2);}
  h3{font-size:14px; margin:14px 0 8px;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:8px 0 3px;}
  input[type=text],input[type=number],textarea,select{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:13.5px; background:#fff;}
  textarea{min-height:70px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:180px;}
  table{width:100%; border-collapse:collapse; margin-top:8px; font-size:13px;}
  th,td{border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top;}
  th{background:var(--soft); font-size:12px; color:var(--brand2);}
  .btn{border:none; border-radius:7px; padding:8px 14px; cursor:pointer; font-weight:600; font-size:13px; background:var(--brand); color:#fff;}
  .btn:hover{background:var(--brand2);}
  .btn.sec{background:#e5e9f5; color:var(--brand2);}
  .btn.sec:hover{background:#d5dbef;}
  .btn.dgr{background:#fde8e8; color:var(--bad);}
  .btn.ok{background:var(--ok); color:#fff;}
  .btn.sm{padding:4px 9px; font-size:12px;}
  .muted{color:var(--muted); font-size:12.5px;}
  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .p-ok{background:#e6f4ea; color:var(--ok);} .p-warn{background:#fdf1e3; color:var(--warn);} .p-bad{background:#fde8e8; color:var(--bad);} .p-info{background:var(--soft); color:var(--brand2);}
  .cand-item{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#fff;}
  .cand-item.sel{border-color:var(--brand); background:var(--soft);}
  .score-total{font-size:26px; font-weight:800; color:var(--brand2);}
  .chk{display:flex; gap:8px; align-items:flex-start; margin:5px 0; font-size:13px;}
  .chk input{margin-top:2px;}
  .hidden{display:none !important;}
  .grid2{display:grid; grid-template-columns:300px 1fr; gap:16px;}
  @media(max-width:880px){.grid2{grid-template-columns:1fr;}}
  .dim-box{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fbfcff;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; align-items:center;}
  .note{background:#fffbe8; border:1px solid #f2e3a0; border-radius:8px; padding:9px 12px; font-size:12.5px; color:#7a5d00; margin:8px 0;}
  .info{background:#eef4ff; border:1px solid #c7d6f5; border-radius:8px; padding:9px 12px; font-size:12.5px; color:#1e3a8a; margin:8px 0;}
  .drop{border:2px dashed var(--brand); border-radius:10px; padding:22px; text-align:center; background:#f8faff; cursor:pointer;}
  .drop:hover{background:#eef1fb;}
  .sug{border:1px solid var(--line); border-radius:7px; padding:7px 10px; margin:6px 0; display:flex; gap:8px; align-items:center; justify-content:space-between; background:#fff;}
  .sug span{font-size:12.5px; flex:1;}
  #printArea{display:none;}
  @media print{
    body{background:#fff;}
    header,nav.tabs,.no-print,#tabContent{display:none !important;}
    #printArea{display:block !important; font-size:12px;}
    #printArea h1{font-size:17px;} #printArea h2{font-size:14px; margin-top:14px;}
    #printArea table{font-size:11px;}
  }
</style>

<script>
/* ================= DATA MODEL ================= */
const DIMS = [
 {key:'f',     label:'Pengalaman Fungsional Relevan',        w:25, desc:'Bukti tanggung jawab langsung yang relevan dengan peran target.'},
 {key:'t',     label:'Kompetensi Transferable',              w:20, desc:'Kemampuan dari konteks/jabatan/industri lain yang relevan secara fungsional.'},
 {key:'tech',  label:'Kemampuan Teknis & Spesifik Pekerjaan',w:20, desc:'Keterampilan teknis inti yang dibutuhkan peran.'},
 {key:'ach',   label:'Bukti Pencapaian & Eksekusi',          w:15, desc:'Hasil terukur atau bukti penyelesaian tugas yang didokumentasikan.'},
 {key:'scope', label:'Cakupan Tanggung Jawab & Pemecahan Masalah', w:10, desc:'Tingkat kompleksitas, akuntabilitas, dan pengambilan keputusan.'},
 {key:'learn', label:'Agilitas Belajar & Adaptabilitas',     w:10, desc:'Bukti adaptasi, peningkatan tanggung jawab, transisi peran.'}
];
const REQ_STATUS = ['MEMENUHI','PERLU VERIFIKASI','TIDAK TEREKAM','TERKONFIRASI TIDAK MEMENUHI','N/A'];
const AUDIT_ITEMS = [
 'Apakah saya menolak kandidat karena istilah/judul jabatan, bukan substansi?',
 'Apakah saya memberi nilai berlebihan karena CV terdengar mengesankan?',
 'Apakah saya menganggap tahun pengalaman = kualitas pengalaman?',
 'Apakah saya menganggap judul jabatan sebagai bukti kompetensi?',
 'Apakah saya memperlakukan informasi yang tidak ada sebagai bukti negatif?',
 'Apakah saya melewatkan keterampilan transferable yang relevan?',
 'Apakah kesan subjektif terlalu berpengaruh pada penilaian?',
 'Apakah standar yang sama diterapkan pada semua kandidat?',
 'Apakah kegagalan membaca dokumen saya perlakukan sebagai kegagalan kualifikasi?',
 'Apakah skor tinggi mengesampingkan persyaratan wajib?'
];
const LS_KEY='yg_cvs_app_v1';
const IMG_CACHE={}; // pratinjau gambar (tidak dipersist)

let state = {
  job:{title:'',purpose:'',reqs:[],weights:{},jdFile:null,jdText:'',jdMode:'upload'},
  cands:[],
  ui:{tab:1,sel:0,showSug:false}
};
DIMS.forEach(d=>state.job.weights[d.key]=d.w);

function uid(){return Math.random().toString(36).slice(2,9);}
function save(){localStorage.setItem(LS_KEY, JSON.stringify(state));}
function load(){
  try{const s=localStorage.getItem(LS_KEY); if(s){const p=JSON.parse(s);
    state.job=Object.assign({title:'',purpose:'',reqs:[],weights:{},jdFile:null,jdText:'',jdMode:'upload'},p.job||{});
    DIMS.forEach(d=>{if(state.job.weights[d.key]==null)state.job.weights[d.key]=d.w;});
    state.cands=p.cands||[]; state.ui=Object.assign({tab:1,sel:0,showSug:false},p.ui||{}); state.ui.tab=Math.min(3,Math.max(1,state.ui.tab||1));}}catch(e){}
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bandOf(s){ if(s>=80)return['Prioritas Tinggi','p-ok']; if(s>=65)return['Wawancara Validasi','p-info']; if(s>=50)return['Kandidat Kondisional','p-warn']; return['Prioritas Rendah','p-bad']; }
function statusPill(st){ if(st==='COMPLETE')return '<span class="pill p-ok">COMPLETE</span>'; if(st==='PARTIAL')return '<span class="pill p-warn">PARTIAL</span>'; return '<span class="pill p-bad">UNVERIFIED</span>'; }

/* ================= OFFLINE FILE EXTRACTION ================= */
function decodeEntities(t){ return t.replace(/&(#x?[0-9a-fA-F]+|\w+);/g,(m,e)=>{
  if(e[0]==='#'){const n=(e[1]==='x'||e[1]==='X')?parseInt(e.slice(2),16):parseInt(e.slice(1),10); return isNaN(n)?m:String.fromCodePoint(n);}
  return {'amp':'&','lt':'<','gt':'>','quot':'"','apos':"'",'nbsp':' '}[e]||m;});}
function statusOf(t){const l=(t||'').trim().length; if(l<10)return 'UNVERIFIED'; if(l<60)return 'PARTIAL'; return 'COMPLETE';}
function fileToDataURL(file){return new Promise(res=>{const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(file);});}

async function inflateRaw(comp){
  const ds=new DecompressionStream('deflate-raw');
  const st=new Blob([comp]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw 'bukan zip';
  const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  const files={}; let p=cdOff; const td=new TextDecoder();
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen));
    const nl2=dv.getUint16(lho+26,true), el2=dv.getUint16(lho+28,true);
    files[name]={method, comp:u8.subarray(lho+30+nl2+el2, lho+30+nl2+el2+csize)};
    p+=46+nlen+elen+clen;
  }
  return files;
}
async function zipEntryText(e){ if(e.method===0) return new TextDecoder().decode(e.comp); return new TextDecoder().decode(await inflateRaw(e.comp)); }

async function docxText(entries){
  const e=entries['word/document.xml']; if(!e) throw 'tidak ada isi dokumen';
  let xml=await zipEntryText(e);
  xml=xml.replace(/<w:tab\/>/g,'\t').replace(/<w:br\s*\/>/g,'\n').replace(/<\/w:tc>/g,'\t').replace(/<\/w:tr>/g,'\n').replace(/<\/w:p>/g,'\n');
  return decodeEntities(xml.replace(/<[^>]+>/g,'')).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function xlsxText(entries){
  const out=[]; const shared=[];
  if(entries['xl/sharedStrings.xml']){
    const s=await zipEntryText(entries['xl/sharedStrings.xml']);
    (s.match(/<si>([\s\S]*?)<\/si>/g)||[]).forEach(si=>shared.push(decodeEntities(si.replace(/<[^>]+>/g,''))));
  }
  const sheets=Object.keys(entries).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort();
  for(const sh of sheets){
    const s=await zipEntryText(entries[sh]);
    out.push('=== '+sh.replace('xl/worksheets/','')+' ===');
    (s.match(/<row[^>]*>([\s\S]*?)<\/row>/g)||[]).forEach(r=>{
      const cells=r.match(/<c\b[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)||[];
      out.push(cells.map(c=>{
        const t=(c.match(/t="([^"]+)"/)||[])[1];
        const isM=c.match(/<is>([\s\S]*?)<\/is>/);
        if(isM) return decodeEntities(isM[1].replace(/<[^>]+>/g,''));
        const vM=c.match(/<v>([\s\S]*?)<\/v>/);
        if(!vM) return '';
        if(t==='s') return shared[Number(vM[1])]??'';
        return decodeEntities(vM[1]);
      }).join('\t'));
    });
  }
  return out.join('\n').trim();
}
function pdfUnescape(x){ return x.replace(/\\(\d{1,3})|\\([\s\S])/g,(m,a,b)=>{
  if(a) return String.fromCharCode(parseInt(a,8));
  return {'n':'\n','r':'\r','t':'\t','b':'\b','f':'\f','(':'(',')':')','\\':'\\'}[b]||b;});}
async function pdfText(buf){
  try{
    const u8=new Uint8Array(buf), td=new TextDecoder('latin1'), s=td.decode(u8);
    const chunks=[]; let idx=0;
    while(true){
      const st=s.indexOf('stream',idx); if(st<0)break;
      let start=st+6; const c1=s[start];
      if(c1==='\r'&&s[start+1]==='\n')start+=2; else if(c1==='\n'||c1==='\r')start+=1;
      const en=s.indexOf('endstream',start); if(en<0)break;
      const header=s.slice(Math.max(0,st-400),st);
      let content=null;
      if(/FlateDecode/.test(header)){ try{content=await inflateRaw(u8.subarray(start,en));}catch(e){} }
      else content=u8.subarray(start,en);
      if(content){ const cs=td.decode(content); if(/Tj|TJ|BT/.test(cs)) chunks.push(cs); }
      idx=en+9;
    }
    let out='';
    const re=/\(((?:\\.|[^\\()])*)\)\s*Tj|\[([^\]]*)\]\s*TJ|<([0-9A-Fa-f\s]+)>\s*Tj/g;
    for(const cs of chunks){
      const blocks=cs.split('BT');
      for(let bi=1;bi<blocks.length;bi++){
        const blk=blocks[bi].split('ET')[0];
        let line=''; let m; re.lastIndex=0;
        while((m=re.exec(blk))){
          if(m[1]!==undefined) line+=pdfUnescape(m[1]);
          else if(m[2]!==undefined){ const parts=m[2].match(/\(((?:\\.|[^\\()])*)\)/g)||[]; line+=parts.map(p=>pdfUnescape(p.slice(1,-1))).join(''); }
          else if(m[3]){ const hex=m[3].replace(/\s/g,''); for(let i=0;i+1<hex.length;i+=2) line+=String.fromCharCode(parseInt(hex.substr(i,2),16)); }
        }
        if(line.trim()) out+=line+'\n';
      }
    }
    out=out.split('\n').map(l=>l.trim()).filter(Boolean).join('\n');
    if(out.trim().length<30) return {status:'UNVERIFIED',text:'',note:'Teks PDF tidak terekstrak (kemungkinan PDF hasil pindai/gambar) — tempel teks manual pada kolom yang tersedia.'};
    const pr=(out.match(/[\x20-\x7E\u00C0-\u00FF]/g)||[]).length/out.length;
    return {status: pr>0.75?'COMPLETE':'PARTIAL', text:out, note: pr>0.75?'':'Sebagian karakter mungkin tidak terbaca sempurna (font PDF tidak standar). Periksa hasil.'};
  }catch(e){ return {status:'UNVERIFIED',text:'',note:'Gagal memproses PDF.'}; }
}
async function extractFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='txt'||ext==='md'){ const t=await file.text(); return {fmt:ext.toUpperCase(),status:statusOf(t),text:t}; }
  if(ext==='docx'||ext==='xlsx'){
    if(!('DecompressionStream' in window)) return {fmt:ext.toUpperCase(),status:'UNVERIFIED',text:'',note:'Browser ini tidak mendukung dekompresi offline (butuh Chrome/Edge/Firefox/Safari versi baru).'};
    try{
      const entries=await unzip(await file.arrayBuffer());
      const text = ext==='docx' ? await docxText(entries) : await xlsxText(entries);
      return {fmt:ext.toUpperCase(),status:statusOf(text),text};
    }catch(e){ return {fmt:ext.toUpperCase(),status:'UNVERIFIED',text:'',note:'Gagal membaca isi dokumen — file mungkin rusak atau terproteksi.'}; }
  }
  if(ext==='pdf'){ const r=await pdfText(await file.arrayBuffer()); return {fmt:'PDF',...r}; }
  if(ext==='doc'||ext==='xls') return {fmt:ext.toUpperCase(),status:'UNVERIFIED',text:'',note:'Format lama (.doc/.xls) tidak dapat dibaca browser — simpan ulang sebagai .docx/.xlsx/.txt lalu upload kembali.'};
  if(['jpg','jpeg','png','webp','gif','bmp'].includes(ext)) return {fmt:ext.toUpperCase(),status:'UNVERIFIED',text:'',note:'Gambar: OCR tidak tersedia offline — lihat gambar, lalu ketik/tempel teks CV-nya pada kolom yang tersedia.',img:await fileToDataURL(file)};
  return {fmt:(ext||'?').toUpperCase(),status:'UNVERIFIED',text:'',note:'Format tidak dikenali.'};
}
/* ================= AUTO ASSESSMENT (heuristik kata kunci) ================= */
const STOPW=new Set(('yang dan di ke dari untuk dengan pada atau adalah ini itu sebagai juga tidak ada dapat akan lebih kurang minimal maksimal tahun serta dalam atas antara sampai agar supaya yakni yaitu tanpa bagi oleh karena jika bila peran kerja jabatan seorang terutama diutamakan syarat kualifikasi').split(' '));
const SYN={inventaris:['inventaris','inventory','stok'],stok:['stok','inventaris','inventory'],kasir:['kasir','pos','mesin edc'],penjualan:['penjualan','sales','selling','omzet'],target:['target','quota'],kepemimpinan:['memimpin','kepemimpinan','lead','leader','supervisi','koordinasi','tim'],komplain:['komplain','complaint','keluhan'],promosi:['promosi','promotion','marketing'],pendidikan:['pendidikan','sarjana','d3','s1','smk','sma'],pengalaman:['pengalaman','experience'],display:['display','tata letak','merchandising'],laporan:['laporan','report','keuangan']};
function kwOf(text){
  const t=(text||'').toLowerCase();
  const words=t.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!STOPW.has(w));
  const set=new Set(words);
  words.forEach(w=>{(SYN[w]||[]).forEach(s=>set.add(s));});
  return [...set];
}
function autoAssess(c){
  if(c.locked)return;
  const txt=(((c.cv||'')+' '+(c.skills||'')+' '+c.exps.map(e=>[e.title,e.co,e.duty].join(' ')).join(' '))).toLowerCase();
  // --- kualifikasi otomatis ---
  state.job.reqs.forEach(r=>{
    const kws=kwOf(r.text); if(!kws.length)return;
    const hits=kws.filter(k=>txt.includes(k));
    let status,note;
    if(hits.length>=Math.max(1,Math.ceil(kws.length*0.5))){status='MEMENUHI';note='Kata kunci cocok: '+hits.slice(0,5).join(', ')+' (otomatis)';}
    else if(hits.length>0){status='PERLU VERIFIKASI';note='Sebagian cocok: '+hits.join(', ')+' — verifikasi manual (otomatis)';}
    else{status='TIDAK TEREKAM';note='Kata kunci tidak ditemukan di CV (otomatis)';}
    if(!c.reqs[r.id])c.reqs[r.id]={status:'',note:''};
    c.reqs[r.id].status=status; c.reqs[r.id].note=note;
  });
  // --- skor dimensi otomatis ---
  const dimTerms={
    f:['pengalaman','jabatan','posisi','tanggung jawab','bertanggung jawab','menangani','mengelola','memimpin','koordinator','supervisor','manager','kepala','staff'],
    t:['komunikasi','kerja sama','teamwork','adaptasi','analisis','problem solving','penyelesaian masalah','perencanaan','organisasi'],
    tech:['excel','sistem','software','aplikasi','kasir','inventaris','stok','laporan','data','operasional','display'],
    ach:['mencapai','meningkatkan','berhasil','target','penjualan','omzet','prestasi','hasil'],
    scope:['keputusan','memimpin','tim','bawahan','penjadwalan','evaluasi','koordinasi','cabang','unit'],
    learn:['pelatihan','training','sertifikasi','pengembangan','kursus','belajar']};
  DIMS.forEach(d=>{
    const terms=dimTerms[d.key];
    const hits=terms.filter(t=>txt.includes(t)).length;
    const s=Math.max(20,Math.min(100,Math.round(hits/terms.length*160)));
    c.scores[d.key]=s;
    c.justs[d.key]='(otomatis) kecocokan kata kunci '+hits+'/'+terms.length+' — verifikasi manual';
  });
  if(!c.confidence)c.confidence='SEDANG';
  if(!c.uncert)c.uncert='Hasil deteksi otomatis dari kecocokan kata kunci — wajib verifikasi manual sebelum keputusan final.';
  c.autoGenerated=true;
}
function autoAssessAll(){state.cands.forEach(c=>autoAssess(c));}
function lockManual(){const c=state.cands[state.ui.sel]; if(c){c.locked=true;c.autoGenerated=false;save();render();alert('Penilaian kandidat ini dikunci manual — auto-assessment tidak akan menimpa lagi.');}}

function suggestName(text,fname){
  const lines=(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,25);
  for(const l of lines){ const m=l.match(/^nama\s*[:\-]?\s*(.+)$/i); if(m&&m[1].length>2&&m[1].length<70) return m[1].replace(/\s{2,}/g,' ').trim(); }
  for(const l of lines){ if(l.length<60&&!/[:;|]/.test(l)&&!/curriculum|resume|vitae|lamaran/i.test(l)) return l; }
  return fname.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
}

/* ================= UPLOAD HANDLERS ================= */
async function handleJDUpload(ev){
  const f=ev.target.files[0]; ev.target.value=''; if(!f)return;
  const r=await extractFile(f);
  state.job.jdFile={name:f.name,fmt:r.fmt,status:r.status,note:r.note||''};
  state.job.jdText=r.text||'';
  if(r.img) IMG_CACHE['job']=r.img;
  autoAssessAll();
  if(state.cands.length)state.ui.tab=3;
  save(); render();
}
async function handleCVUpload(ev){
  const files=[...ev.target.files]; ev.target.value='';
  for(const f of files){
    const dup=state.cands.some(c=>c.file&&c.file.name===f.name);
    const r=await extractFile(f);
    const c=blankCand();
    c.file={name:f.name,fmt:r.fmt,status:r.status,note:(r.note||'')+(dup?' — KEMUNGKINAN DUPLIKAT (nama file sama sudah ada).':'')};
    c.cv=r.text||''; c.name=suggestName(r.text,f.name);
    if(r.img) IMG_CACHE[c.id]=r.img;
    autoAssess(c);
    state.cands.push(c);
  }
  state.ui.sel=state.cands.length-1;
  state.ui.tab=3;
  save(); render();
}

function render(){
  [1,2,3].forEach(i=>document.getElementById('tb'+i).classList.toggle('active', state.ui.tab===i));

}

function suggestReqs(){
  const lines=(state.job.jdText||'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>8&&l.length<220);
  const kw=/minimal|maksimal|mampu|memiliki|menguasai|pengalaman|pendidikan|usia|berpengalaman|terbiasa|jujur|teliti|diutamakan|dapat|bertanggung/i;
  const bull=/^([-•*–]|\d+[.)])\s*/;
  const seen=new Set(); const out=[];
  for(const l of lines){ if((kw.test(l)||bull.test(l))&&!seen.has(l)){seen.add(l);out.push(l.replace(bull,''));} if(out.length>=40)break; }
  return out;
}

/* ============ TAB 3: ASSESSMENT ============ */
function totalScore(c){
  let sumW=0,acc=0,complete=true;
  DIMS.forEach(d=>{const w=Number(state.job.weights[d.key])||0; sumW+=w;
    const s=c.scores[d.key]; if(s==null||s==='')complete=false; else acc+=(Number(s)/100)*w;});
  if(!complete)return null;
  return sumW>0?Math.round(acc/sumW*100):null;
}

    ${c.confidence==='RENDAH'?'<div class="note">Skor dengan kepercayaan bukti RENDAH wajib ditandai untuk verifikasi sebelum keputusan.</div>':''}
  </div>
  <div class="card"><h2>Audit Skeptis (semua harus dicentang sebelum rekomendasi final)</h2>${audit}</div>
  <div class="card"><h2>Pertanyaan Wawancara Targeted (maks. 5, fokus verifikasi)</h2>
    <textarea style="min-height:100px" onchange="updCand('interview',this.value)" placeholder="1. ...&#10;2. ...">${esc(c.interview)}</textarea>
  </div>
  ${viewResultsInline()}`;
}

function viewResultsInline(){
  const rows=state.cands.map((c,i)=>({c,i,t:totalScore(c)})).sort((a,b)=>(b.t??-1)-(a.t??-1));
  const trs=rows.map((r,n)=>{const g=gateInfo(r.c); const rec=recommend(r.c); const b=r.t!=null?bandOf(r.t):['—','p-info'];
    const verdict=g.fails.length?'<span class="pill p-bad">TIDAK LOLOS</span>':(g.vers.length||g.unrec.length)?'<span class="pill p-warn">LOLOS BERSYARAT</span>':'<span class="pill p-ok">LOLOS</span>';
    return `<tr><td>${n+1}</td><td><b>${esc(r.c.name)||('Kandidat '+(r.i+1))}</b></td>
      <td>${verdict}</td>
      <td>${r.t==null?'—':r.t}</td><td><span class="pill ${b[1]}">${b[0]}</span></td>
      <td>${r.c.confidence||'—'}</td>
      <td>${g.fails.length?'<span class="pill p-bad">Gagal syarat wajib</span>':g.vers.length?'<span class="pill p-warn">Perlu verifikasi</span>':g.unrec.length?'<span class="pill p-info">Belum dinilai</span>':'<span class="pill p-ok">Bersih</span>'}</td>
      <td><span class="pill ${rec[1]}">${rec[0]}</span></td>
      <td class="muted">${esc(r.c.uncert)||'—'}</td></tr>`;}).join('');
  const nHigh=state.cands.filter(c=>{const t=totalScore(c);return t!=null&&t>=80&&!gateInfo(c).fails.length;}).length;
  const nUnv=state.cands.filter(c=>c.file&&c.file.status==='UNVERIFIED').length;
  return `<div class="card">
    <h2>Ringkasan Eksekutif</h2>
    <p class="muted">Posisi: <b>${esc(state.job.title)||'—'}</b> · Kandidat: <b>${state.cands.length}</b> · Prioritas tinggi: <b>${nHigh}</b> · Berkas UNVERIFIED: <b>${nUnv}</b>${nUnv?' (bukan bukti ketidaklayakan — perlu verifikasi manual)':''}</p>
    <p class="muted" style="margin-top:6px">Interpretasi skor: 80–100 Prioritas Tinggi · 65–79 Wawancara Validasi · 50–64 Kondisional · &lt;50 Prioritas Rendah. Skor adalah panduan prioritas, bukan prediksi ilmiah kinerja.</p>
  </div>
  <div class="card">
    <h2>Tabel Perbandingan Kandidat</h2>
    <table><thead><tr><th>#</th><th>Kandidat</th><th>Hasil</th><th>Skor</th><th>Interpretasi</th><th>Kepercayaan</th><th>Syarat Wajib</th><th>Rekomendasi</th><th>Ketidakpastian Utama</th></tr></thead>
    <tbody>${trs}</tbody></table>
  </div>
  <div class="toolbar no-print">
    <button class="btn sec" onclick="lockManual()">Kunci Penilaian Manual (hentikan auto)</button>
    <button class="btn" onclick="autoAssessAll();save();render()">Jalankan Ulang Auto-Assessment</button>
    <button class="btn ok" onclick="exportCSV()">Export CSV</button>
    <button class="btn sec" onclick="exportJSON()">Backup Data (JSON)</button>
    <button class="btn sec" onclick="document.getElementById('impFile').click()">Pulihkan Data (JSON)</button>
    <button class="btn" onclick="printReport()">Cetak Laporan</button>
  </div>`;
}
function updScore(k,v){const c=state.cands[state.ui.sel]; c.scores[k]=v===''?'':Math.max(0,Math.min(100,Number(v))); save();
  const t=totalScore(c); const el=document.getElementById('totScore');
  if(el)el.innerHTML=(t==null?'—':t+' / 100')+(t!=null?(()=>{const b=bandOf(t);return ` <span class="pill ${b[1]}">${b[0]}</span>`;})():'');}
function updJust(k,v){state.cands[state.ui.sel].justs[k]=v; save();}
function setReq(id,f,v){const c=state.cands[state.ui.sel]; if(!c.reqs[id])c.reqs[id]={status:'',note:''}; c.reqs[id][f]=v; save();}
function toggleAudit(i){const c=state.cands[state.ui.sel]; c.audit[i]=!c.audit[i]; save();}

/* ============ TAB 4: RESULTS ============ */
function gateInfo(c){
  const fails=[],vers=[],unrec=[];
  state.job.reqs.forEach(r=>{if(!r.mand)return; const s=(c.reqs[r.id]||{}).status;
    if(s==='TERKONFIRASI TIDAK MEMENUHI')fails.push(r.text);
    else if(s==='PERLU VERIFIKASI')vers.push(r.text);
    else if(!s||s==='TIDAK TEREKAM')unrec.push(r.text);});
  return{fails,vers,unrec};
}
function recommend(c){
  const t=totalScore(c); const g=gateInfo(c);
  if(g.fails.length)return['TIDAK LANJUT — syarat wajib tidak terpenuhi','p-bad'];
  if(t==null)return['TUNDA — penilaian belum lengkap','p-warn'];
  let rec,b;
  if(t>=80){rec='WAWANCARA PRIORITAS';b='p-ok';}
  else if(t>=65){rec='WAWANCARA UNTUK VALIDASI';b='p-info';}
  else if(t>=50){rec='KANDIDAT KONDISIONAL (telaah gap)';b='p-warn';}
  else{rec='PRIORITAS RENDAH';b='p-bad';}
  if(g.vers.length)rec+=' — perlu verifikasi syarat wajib';
  return[rec,b];
}
function exportCSV(){
  let csv='Nama;Usia;Pendidikan;File;Format;StatusEkstraksi;Skor;Interpretasi;Kepercayaan;SyaratWajib;Rekomendasi;Ketidakpastian\n';
  state.cands.forEach(c=>{const t=totalScore(c);const g=gateInfo(c);const rec=recommend(c);const b=t!=null?bandOf(t)[0]:'Belum lengkap';
    csv+=`"${c.name}";"${c.age}";"${c.edu}";"${c.file?c.file.name:''}";"${c.file?c.file.fmt:''}";"${c.file?c.file.status:''}";${t??''};"${b}";"${c.confidence}";"${g.fails.length?'Gagal':g.vers.length?'Perlu verifikasi':'OK'}";"${rec[0]}";"${c.uncert}"\n`;});
  download(new Blob(['\ufeff'+csv],{type:'text/csv'}),'hasil_screening.csv');
}
function exportJSON(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'backup_screening.json');}
function importJSON(ev){const f=ev.target.files[0]; ev.target.value=''; if(!f)return; const r=new FileReader();
  r.onload=e=>{try{const p=JSON.parse(e.target.result); if(!p.job||!p.cands)throw 0;
    state=p; DIMS.forEach(d=>{if(state.job.weights[d.key]==null)state.job.weights[d.key]=d.w;});
    save(); render(); alert('Data dipulihkan.');}catch(x){alert('File tidak valid.');}}; r.readAsText(f);}
function download(blob,name){const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);}
function printReport(){
  const rows=state.cands.map((c,i)=>({c,i,t:totalScore(c)})).sort((a,b)=>(b.t??-1)-(a.t??-1));
  let h=`<h1>Laporan Screening — ${esc(state.job.title)||'(posisi belum diisi)'}</h1>
  <p>Tujuan peran: ${esc(state.job.purpose)||'—'} · Dicetak: ${new Date().toLocaleString('id-ID')}</p>
  <h2>Register File & Kandidat</h2><table border="1" cellspacing="0" cellpadding="4">
  <tr><th>File</th><th>Format</th><th>Kandidat</th><th>Status</th><th>Catatan</th></tr>
  ${state.cands.map(c=>`<tr><td>${esc(c.file?c.file.name:'-')}</td><td>${esc(c.file?c.file.fmt:'-')}</td><td>${esc(c.name)}</td><td>${esc(c.file?c.file.status:'-')}</td><td>${esc(c.file?c.file.note:'')}</td></tr>`).join('')}</table>
  <h2>Tabel Perbandingan</h2><table border="1" cellspacing="0" cellpadding="4">
  <tr><th>#</th><th>Kandidat</th><th>Skor</th><th>Interpretasi</th><th>Kepercayaan</th><th>Syarat Wajib</th><th>Rekomendasi</th></tr>`;
  rows.forEach((r,n)=>{const g=gateInfo(r.c);const rec=recommend(r.c);const b=r.t!=null?bandOf(r.t)[0]:'Belum lengkap';
    h+=`<tr><td>${n+1}</td><td>${esc(r.c.name)}</td><td>${r.t??'—'}</td><td>${b}</td><td>${r.c.confidence||'—'}</td>
    <td>${g.fails.length?'Gagal: '+esc(g.fails.join('; ')):g.vers.length?'Perlu verifikasi: '+esc(g.vers.join('; ')):'OK'}</td><td>${rec[0]}</td></tr>`;});
  h+='</table>';
  rows.forEach((r,n)=>{const c=r.c;const g=gateInfo(r.c);
    h+=`<h2>${n+1}. ${esc(c.name)||'Kandidat '+(r.i+1)} — Skor ${r.t??'—'}</h2>
    <p><b>Pendidikan:</b> ${esc(c.edu)||'—'} · <b>Usia:</b> ${esc(c.age)||'—'} · <b>File:</b> ${esc(c.file?c.file.name:'-')} (${esc(c.file?c.file.status:'-')})</p>
    <p><b>Ringkasan CV:</b><br>${esc((c.cv||'').slice(0,1500)).replace(/\n/g,'<br>')||'—'}</p>
    <p><b>Justifikasi skor:</b></p><ul>${DIMS.map(d=>`<li>${d.label}: ${c.scores[d.key]??'—'}/100 — ${esc(c.justs[d.key]||'tanpa justifikasi')}</li>`).join('')}</ul>
    <p><b>Kualifikasi wajib bermasalah:</b> ${g.fails.concat(g.vers).map(esc).join('; ')||'—'}</p>
    <p><b>Ketidakpastian utama:</b> ${esc(c.uncert)||'—'}</p>
    <p><b>Pertanyaan wawancara:</b><br>${esc(c.interview).replace(/\n/g,'<br>')||'—'}</p>`;});
  document.getElementById('printArea').innerHTML=h;
  window.print();
}

load(); render();
</script>
</body>
</html>
